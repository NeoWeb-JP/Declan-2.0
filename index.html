<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Declan 2.0</title>
<style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; color: #e7f7ff; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; background-color: #060d14;
  background-image: linear-gradient(#22475933 1px, transparent 1px),
    linear-gradient(90deg, #22475933 1px, transparent 1px),
    radial-gradient(ellipse at 50% 42%, #123040 0%, transparent 54%);
  background-size: 40px 40px, 40px 40px, 100% 100%;
}
header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
  gap: .7rem; min-height: 58px; padding: .5rem clamp(1rem, 3vw, 2rem); border-bottom: 1px solid #183341; }
h1 { margin: 0; font: 700 clamp(1rem, 3vw, 1.5rem) ui-monospace, monospace; letter-spacing: .28em; }
h1 small { font-size: .55em; letter-spacing: .08em; }
.brand { display: flex; align-items: center; gap: .65rem; }
.brand img { width: 38px; height: 38px; border-radius: 50%; }
.mono, summary { font: .8rem ui-monospace, monospace; color: #a1ccdf; }
summary, button { cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid #91e3ff; outline-offset: 4px; }
.settings { position: relative; }
.settings-menu { position: absolute; z-index: 1; right: 0; top: calc(100% + .4rem);
  display: grid; gap: .65rem; padding: .85rem; white-space: nowrap; background: #0b1a25;
  border: 1px solid #2a6379; border-radius: .5rem; }
.settings-menu button { color: #c7f7ff; background: #102635; border: 1px solid #315568;
  border-radius: .35rem; padding: .45rem .6rem; font: inherit; text-align: left; }
main { width: min(760px, calc(100% - 2rem)); margin: auto; text-align: center; padding-bottom: 3rem; }
.voice-stage { min-height: clamp(230px, 54vh, 470px); display: grid; place-items: center; }
#talk { width: clamp(130px, 24vw, 190px); aspect-ratio: 1; border: 1px solid #285267;
  border-radius: 50%; color: #b4dced; background: radial-gradient(circle at 48% 48%, #184860, #081722 74%);
  box-shadow: 0 0 52px #369dcc22, inset 0 0 24px #07141d; font: 600 .78rem ui-monospace, monospace; }
#talk:not(:disabled):hover, #talk[aria-pressed="true"] { border-color: #76dbff; box-shadow: 0 0 55px #48bfff55; }
#talk { display: grid; place-content: center; justify-items: center; gap: .6rem; }
#voice-pattern { width: 94px; height: 32px; }
#talk[aria-pressed="false"] #voice-pattern { opacity: .4; }
#voice-status { min-height: 1.25rem; margin: 0; letter-spacing: .15em; text-transform: uppercase; }
#latest-message, #latest-reply { overflow-wrap: anywhere; }
#latest-message { margin: .75rem 0 .5rem; font-size: clamp(1.2rem, 3vw, 1.55rem); }
#latest-reply { min-height: 1.5rem; color: #a1ccdf; margin: 0 0 2rem; }
form { display: flex; align-items: center; gap: .65rem; padding: .65rem;
  border: 1px solid #2a6379; border-radius: .85rem; background: #0a1621; }
form input { flex: 1; min-width: 0; color: #e7f7ff; background: transparent; border: 0; padding: .5rem;
  font: 1rem ui-monospace, monospace; }
form input::placeholder { color: #a1ccdf; }
form button { color: #e7f7ff; background: #143347; border: 0; border-radius: .5rem; min-height: 44px; padding: .6rem .85rem; }
.keyboard { margin-top: 1rem; }
.keyboard form { margin-top: .65rem; }
.history { width: min(900px, calc(100% - 2rem)); max-width: none; padding: 0;
  text-align: left; color: #e7f7ff; background: #091621;
  border: 1px solid #264656; border-radius: .75rem; }
.history::backdrop { background: #03090dc4; }
.history-heading { display: flex; align-items: center; justify-content: space-between;
  gap: .75rem; padding: .75rem 1rem; border-bottom: 1px solid #264656; }
.history-heading h2 { margin: 0; font-size: 1rem; }
.history-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; padding: .65rem 1rem; }
.history-toolbar p { flex: 1 1 13rem; margin: 0; }
#clear-history { color: #fff; background: #9e2835; border-color: #ec7c87; }
#clear-history:hover:not(:disabled) { background: #b52e3d; }
.history button, .history a { color: #c7f7ff; background: #102635; border: 1px solid #315568;
  border-radius: .35rem; padding: .35rem .6rem; font: inherit; font-size: .8rem; }
.history a { text-decoration: none; }
.history button:hover, .history a:hover { background: #19394b; }
#history-status { margin: .5rem 1rem; }
#history-status:empty { margin: 0; }
#chat { max-height: clamp(19rem, 58vh, 42rem); overflow: auto; margin: 0; padding: 0; list-style: none; }
#chat > li { display: grid; gap: .25rem; padding: .65rem 1rem; border-top: 1px solid #203747;
  font-size: .9rem; overflow-wrap: anywhere; }
.turn-status { color: #a1ccdf; font-size: .8rem; }
#older-history { margin: .65rem 1rem; }
@media (min-width: 680px) {
  #chat > li { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); column-gap: .85rem; }
  .turn-meta { grid-column: 1 / -1; }
  .turn-status { grid-column: 2; }
}
body { margin: clamp(5px, 1vw, 12px); min-height: calc(100vh - clamp(10px, 2vw, 24px));
  border: 1px solid #1d3d51; background-size: 32px 32px, 32px 32px, 100% 100%; }
header { position: relative; background: #060d14a8; }
h1 small { color: #62e7ff; border: 1px solid #388da2; border-radius: 3px; padding: .14rem .25rem; vertical-align: middle; }
.connection { position: fixed; right: max(1rem, env(safe-area-inset-right));
  bottom: calc(max(.75rem, env(safe-area-inset-bottom)) + .5rem); padding: .35rem .55rem;
  max-width: calc(100% - 2rem); box-sizing: border-box; overflow-wrap: anywhere;
  border-radius: .35rem; background: #060d14e6; }
.connection::before { content: ''; display: inline-block; width: 6px; height: 6px; margin-right: .5rem;
  border-radius: 50%; background: #7796a8; }
.connection:has([data-state="connected"])::before { background: #62e7ff; box-shadow: 0 0 8px #62e7ff; }
.connection:has([data-state="disconnected"])::before,
.connection:has([data-state="authentication_failed"])::before { background: #ffb777; }
.settings summary { display: grid; place-items: center; list-style: none; width: 38px; height: 38px;
  border: 1px solid #24566c; border-radius: 10px; color: #66e7ff; background: #0a1621; }
.settings summary::-webkit-details-marker { display: none; }
.settings svg { width: 18px; }
main { width: min(600px, calc(100% - 2rem)); }
.voice-stage { min-height: clamp(255px, 56vh, 370px); padding: 1rem 0; }
.voice-core { position: relative; width: clamp(216px, 46vw, 316px); aspect-ratio: 1;
  display: grid; place-items: center; }
.voice-rings { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
  fill: none; color: #337b90; }
.voice-rings .segments { stroke: #52b6ce; opacity: .45; transition: opacity .25s; }
.voice-core:has(#talk[aria-pressed="true"]) .segments { opacity: .9; }
#talk { z-index: 1; width: 48%; border-color: #5be0fa; color: #c7f7ff;
  gap: 0; box-shadow: 0 0 38px #3bb4e128, inset 0 0 24px #07141d; }
#talk-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
#voice-pattern { width: 73%; height: auto; }
#voice-status { color: #62e7ff; letter-spacing: .3em; }
#latest-reply { margin-bottom: 1.5rem; }
.keyboard > summary { display: inline-flex; align-items: center; gap: .4rem; list-style: none;
  padding: .5rem .75rem; border: 1px solid #264656; border-radius: .4rem; }
.keyboard > summary::-webkit-details-marker { display: none; }
.keyboard > summary:hover { color: #e7f7ff; background: #0a1621; }
.keyboard .hide-keyboard, .keyboard[open] .show-keyboard { display: none; }
.keyboard[open] .hide-keyboard { display: inline; }
.key-icon { font-size: 1rem; }
form button { color: #07151f; background: #62e7ff; font-weight: 700; }
</style>
<header>
  <div class="brand">
    <img src="/logo.png" alt="" width="38" height="38">
    <h1>DECLAN <small>2.0</small></h1>
  </div>
  <details class="settings"><summary aria-label="Settings" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <path d="M3 6h7m4 0h7M3 12h12m4 0h2M3 18h3m4 0h11"/>
      <circle cx="12" cy="6" r="2"/><circle cx="17" cy="12" r="2"/><circle cx="8" cy="18" r="2"/>
    </svg>
  </summary>
    <div class="settings-menu">
      <label><input id="use-assist-stt" type="checkbox" checked> Use Home Assistant speech recognition</label>
      <label><input id="spoken-replies" type="checkbox" checked> Speak voice replies</label>
      <button type="button" id="open-history" aria-haspopup="dialog">Conversation history</button>
      <button type="button" id="open-spotify" aria-haspopup="dialog">Spotify settings</button>
    </div>
  </details>
</header>
<div class="mono connection"><span id="ha-status" role="status">Checking Home Assistant.</span>
  <button id="open-updates" type="button" aria-haspopup="dialog">Updates</button>
</div>
<main>
  <div class="voice-stage"><div class="voice-core">
    <svg class="voice-rings" viewBox="0 0 320 320" aria-hidden="true">
      <circle cx="160" cy="160" r="157" stroke="currentColor" stroke-width="1.5" stroke-dasharray="1 6"/>
      <circle cx="160" cy="160" r="142" stroke="currentColor" opacity=".55"/>
      <circle class="segments" cx="160" cy="160" r="124" stroke-width="5.5" stroke-dasharray="65 16.16"/>
      <circle cx="160" cy="160" r="101" stroke="currentColor" fill="#11384b55"/>
    </svg>
    <button id="talk" type="button" aria-pressed="false">
    <canvas id="voice-pattern" width="188" height="145" aria-hidden="true"></canvas>
    <span id="talk-label">Talk to Declan</span>
    </button>
  </div></div>
  <p id="voice-status" class="mono" role="status"></p>
  <div aria-live="polite" aria-atomic="true">
    <p id="latest-message">How can I help?</p>
    <p id="latest-reply"></p>
  </div>
  <p class="mono">Tap the orb to pause or resume listening</p>
  <details class="keyboard" id="keyboard">
    <summary>
      <span class="key-icon" aria-hidden="true">⌨</span>
      <span class="show-keyboard">Use keyboard</span>
      <span class="hide-keyboard">Hide keyboard</span>
    </summary>
    <form>
      <input aria-label="Message" placeholder="Type a command or ask Declan" maxlength="1000" required>
      <button>Send</button>
    </form>
  </details>
</main>
  <dialog class="history" id="history" aria-labelledby="history-title">
    <div class="history-heading">
      <h2 id="history-title">Conversation history</h2>
      <button type="button" id="close-history" autofocus>Close</button>
    </div>
    <div class="history-toolbar">
      <p class="mono">Browser and Assist messages from the last 30 days</p>
      <button type="button" id="refresh-history">Refresh</button>
      <a href="/api/history/export" download>Export JSON</a>
      <button type="button" id="clear-history">Clear History</button>
    </div>
    <p id="history-status" class="mono" role="status"></p>
    <details class="turn-status" id="learned-intents" hidden>
      <summary>Learned intentions</summary>
      <ul id="learned-intent-list"></ul>
    </details>
    <ul id="chat" aria-label="Conversation"></ul>
    <button type="button" id="older-history" hidden>Load older messages</button>
  </dialog>
  <dialog class="history" id="spotify-settings" aria-labelledby="spotify-settings-title">
    <div class="history-heading">
      <h2 id="spotify-settings-title">Spotify search credentials</h2>
      <button type="button" id="close-spotify">Close</button>
    </div>
    <form id="spotify-form" class="history-toolbar" autocomplete="off">
      <label>Client ID <input name="client_id" maxlength="256" required></label>
      <label>Client Secret <input name="client_secret" type="password" maxlength="256" required></label>
      <button type="submit">Save credentials</button>
      <p id="spotify-status" class="mono" role="status"></p>
    </form>
  </dialog>
<dialog class="history" id="updates" aria-labelledby="updates-title">
  <div class="history-heading"><h2 id="updates-title">Declan updates</h2>
    <button id="close-updates" type="button">Close</button></div>
  <div class="history-toolbar">
    <button id="check-updates" type="button">Check for updates</button>
    <label>Release <select id="update-version" disabled></select></label>
    <button id="install-update" type="button" disabled>Install selected release</button>
  </div>
  <p id="update-status" class="mono" role="status"></p>
</dialog>
<script>
const haStatus = document.querySelector('#ha-status');
const haStatusLabels = {
  connected: 'Home Assistant connected',
  assist_recent: 'Home Assistant Assist active recently',
  not_configured: 'Home Assistant not configured',
  authentication_failed: 'Home Assistant sign-in failed',
  disconnected: 'Home Assistant disconnected'
};
let buildLabel = '';
async function refreshHAStatus() {
  let state = 'disconnected';
  try {
    const response = await fetch('/api/ha-status', {signal: AbortSignal.timeout(4500)});
    if (response.ok) {
      const result = await response.json();
      if (Object.hasOwn(haStatusLabels, result.status)) state = result.status;
      if (Object.hasOwn(result, 'release_version')) {
        buildLabel = result.release_version ? `Release ${result.release_version}` : 'Development build';
      }
    }
  } catch {
    // A failed connection check must never be shown as connected.
  }
  haStatus.dataset.state = state;
  const label = [haStatusLabels[state], buildLabel].filter(Boolean).join(' · ');
  if (haStatus.textContent !== label) haStatus.textContent = label;
  setTimeout(refreshHAStatus, 15000);
}
void refreshHAStatus();

const updatesPanel = document.querySelector('#updates');
const checkUpdates = document.querySelector('#check-updates');
const updateVersion = document.querySelector('#update-version');
const installUpdate = document.querySelector('#install-update');
const updateStatus = document.querySelector('#update-status');

document.querySelector('#open-updates').addEventListener('click', () => {
  updatesPanel.showModal();
  checkUpdates.click();
});
document.querySelector('#close-updates').addEventListener('click', () => updatesPanel.close());

async function watchUpdate(version) {
  updateStatus.textContent = `Preparing ${version}. Declan will restart automatically.`;
  const deadline = Date.now() + 8 * 60 * 1000;
  while (Date.now() < deadline) {
    await new Promise(resolve => setTimeout(resolve, 2000));
    try {
      const response = await fetch('/api/updates/status', {signal: AbortSignal.timeout(4000)});
      if (response.status === 404 && (await fetch('/health', {signal: AbortSignal.timeout(4000)})).ok) {
        location.reload();
        return;
      }
      if (!response.ok) continue;
      const result = await response.json();
      if (result.current === version) {
        location.reload();
        return;
      }
      if (result.state === 'failed') {
        updateStatus.textContent = 'Update failed during preparation. The current build is still running.';
        return;
      }
    } catch {
      // The service can be briefly unreachable while systemd restarts it.
    }
  }
  updateStatus.textContent = 'Could not verify the restart. Check the Declan service log.';
}

checkUpdates.addEventListener('click', async () => {
  checkUpdates.disabled = updateVersion.disabled = installUpdate.disabled = true;
  updateStatus.textContent = 'Checking GitHub…';
  try {
    const response = await fetch('/api/updates');
    const result = await response.json();
    if (!response.ok) throw new Error(result.error);
    if (!result.enabled) {
      updateStatus.textContent = 'Updates are not enabled on this installation.';
    } else if (['installing', 'restarting'].includes(result.state)) {
      await watchUpdate(result.version);
    } else {
      const versions = result.versions.filter(version => version !== result.current);
      updateVersion.replaceChildren(...versions.map(version => new Option(version, version)));
      updateVersion.disabled = installUpdate.disabled = !versions.length;
      updateStatus.textContent = versions.length ? `Running ${result.current || 'a development build'}.` : 'No other tagged releases found.';
    }
  } catch (error) {
    updateStatus.textContent = error.message;
  } finally {
    checkUpdates.disabled = false;
  }
});

installUpdate.addEventListener('click', async () => {
  const version = updateVersion.value;
  if (!version) return;
  checkUpdates.disabled = updateVersion.disabled = installUpdate.disabled = true;
  try {
    const response = await fetch('/api/updates', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({version})
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error);
    await watchUpdate(version);
  } catch (error) {
    updateStatus.textContent = error.message;
  } finally {
    checkUpdates.disabled = false;
  }
});

const form = document.querySelector('form');
const input = form.querySelector('input');
const button = form.querySelector('button');
const chat = document.querySelector('#chat');
const historyPanel = document.querySelector('#history');
const historyStatus = document.querySelector('#history-status');
const olderHistory = document.querySelector('#older-history');
const clearHistory = document.querySelector('#clear-history');
let historyCursor = null;
let loadingHistory = false;
const sources = {assist: 'Assist', ha_sentence: 'Assist · Home Assistant routine', browser_voice: 'Browser voice', browser_keyboard: 'Browser keyboard'};

async function updateLearnedIntent(change) {
  const response = await fetch('/api/history/intents', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(change),
  });
  const result = await response.json();
  if (!response.ok) throw new Error(result.error || 'Could not save the intention.');
}

function renderLearnedIntents(aliases) {
  const list = document.querySelector('#learned-intent-list');
  list.replaceChildren();
  for (const [phrase, target] of Object.entries(aliases)) {
    const item = document.createElement('li');
    item.textContent = `“${phrase}” → “${target}” `;
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = 'Forget';
    button.addEventListener('click', async () => {
      button.disabled = true;
      try {
        await updateLearnedIntent({forget: phrase});
        delete aliases[phrase];
        renderLearnedIntents(aliases);
        historyStatus.textContent = 'Intention forgotten.';
      } catch (error) {
        historyStatus.textContent = error.message;
        button.disabled = false;
      }
    });
    item.append(button);
    list.append(item);
  }
  document.querySelector('#learned-intents').hidden = !list.children.length;
}

function teachIntentionControl(turn, targets) {
  const details = document.createElement('details');
  details.className = 'turn-status';
  const summary = document.createElement('summary');
  summary.textContent = 'Teach intention';
  const form = document.createElement('form');
  const label = document.createElement('label');
  label.textContent = 'When I say this, run ';
  const select = document.createElement('select');
  select.required = true;
  select.add(new Option('Choose a command', ''));
  for (const target of targets) select.add(new Option(target, target));
  label.append(select);
  const save = document.createElement('button');
  save.textContent = 'Save correction';
  form.append(label, save);
  details.append(summary, form);
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (!select.value) return;
    save.disabled = true;
    try {
      await updateLearnedIntent({turn_id: turn.id, target: select.value});
      await loadHistory();
      historyStatus.textContent = 'Intention saved for next time.';
    } catch (error) {
      historyStatus.textContent = error.message;
    } finally {
      save.disabled = false;
    }
  });
  return details;
}

async function loadHistory(older = false) {
  if (loadingHistory || (older && historyCursor === null)) return;
  loadingHistory = true;
  clearHistory.disabled = true;
  historyStatus.textContent = 'Loading history…';
  try {
    const query = older ? '?before=' + encodeURIComponent(historyCursor) : '';
    const response = await fetch('/api/history' + query);
    if (!response.ok) throw new Error('History could not be loaded.');
    const {turns, next, teachable_intents: targets, learned_intents: aliases} = await response.json();
    if (aliases) renderLearnedIntents(aliases);
    if (!older) chat.replaceChildren();
    for (const turn of turns) {
      const row = document.createElement('li');
      const meta = document.createElement('div');
      meta.className = 'mono turn-meta';
      meta.textContent = new Date(turn.created_at).toLocaleString() + ' · ' + (sources[turn.source] || 'Declan');
      if (turn.outcome) meta.textContent += ' · ' + turn.outcome.replaceAll('_', ' ');
      const message = document.createElement('div');
      message.textContent = (turn.speaker_match?.name || 'You') + ': ' + turn.message;
      const reply = document.createElement('div');
      reply.textContent = 'Declan: ';
      const replyText = document.createElement(turn.routine_status ? 'strong' : 'span');
      replyText.textContent = turn.reply;
      reply.append(replyText);
      row.append(meta, message, reply);
      if (turn.speaker_match) {
        const match = turn.speaker_match;
        const details = document.createElement('details');
        details.className = 'turn-status';
        const summary = document.createElement('summary');
        const confidence = typeof match.confidence === 'number'
          ? `${Math.round(match.confidence * 100)}% confidence` : 'no confidence score';
        summary.textContent = `Speaker match: ${match.name} (${confidence})`;
        const reference = document.createElement('div');
        reference.textContent = match.interaction_id
          ? `VoicePipeline interaction: ${match.interaction_id}` : 'No VoicePipeline interaction ID was supplied.';
        details.append(summary);
        if (match.candidate && typeof match.confidence === 'number') {
          const candidate = document.createElement('div');
          candidate.textContent = `VoicePipeline candidate: ${match.candidate} (${Math.round(match.confidence * 100)}%)`;
          details.append(candidate);
        }
        details.append(reference);
        row.append(details);
      }
      const movieDetails = turn.routine_status && /^(?:(?:Starting|Ending) )?Movie Time\./.test(turn.reply);
      let routineStatus;
      if (turn.routine_status) {
        routineStatus = document.createElement('div');
        routineStatus.className = 'turn-status';
        routineStatus.textContent = 'Home Assistant Routine Status: ' + turn.routine_status;
        if (!movieDetails) row.append(routineStatus);
      }
      if (turn.action_results?.length || movieDetails) {
        const actions = document.createElement('details');
        actions.className = 'turn-status';
        const title = document.createElement('summary');
        title.textContent = 'Action results';
        const list = document.createElement('ul');
        for (const step of turn.action_results ?? []) {
          const entry = document.createElement('li');
          const action = step.action ? step.action.replaceAll('_', ' ') + ' ' : '';
          const detail = step.detail ? ' (' + step.detail + ')' : '';
          entry.textContent = action + step.target.replaceAll('_', ' ') + ': ' +
            step.status.replaceAll('_', ' ') + detail;
          list.append(entry);
        }
        actions.append(title);
        if (movieDetails) actions.append(routineStatus);
        if (turn.action_results?.length) actions.append(list);
        row.append(actions);
      }
      if (turn.phrase_suggestion) {
        const suggestion = document.createElement('div');
        suggestion.className = 'turn-status';
        suggestion.textContent = 'Possible rephrase (review only): “' + turn.phrase_suggestion + '” → “' + turn.message + '”';
        row.append(suggestion);
      }
      if (turn.teachable && targets?.length) row.append(teachIntentionControl(turn, targets));
      chat.append(row);
    }
    historyCursor = next;
    olderHistory.hidden = next === null;
    historyStatus.textContent = chat.children.length ? '' : 'No saved conversations yet.';
  } catch {
    historyStatus.textContent = 'History could not be loaded. Try Refresh.';
  } finally {
    loadingHistory = false;
    clearHistory.disabled = false;
  }
}
const historySettings = document.querySelector('.settings');
document.querySelector('#open-history').addEventListener('click', () => {
  historySettings.open = false;
  historyPanel.showModal();
  void loadHistory();
});
historyPanel.addEventListener('close', () => historySettings.querySelector('summary').focus());
document.querySelector('#close-history').addEventListener('click', () => historyPanel.close());
const spotifyPanel = document.querySelector('#spotify-settings');
const spotifyForm = document.querySelector('#spotify-form');
const spotifyStatus = document.querySelector('#spotify-status');
document.querySelector('#open-spotify').addEventListener('click', async () => {
  historySettings.open = false;
  spotifyPanel.showModal();
  spotifyStatus.textContent = 'Checking saved credentials…';
  try {
    const response = await fetch('/api/settings/spotify');
    if (!response.ok) throw new Error();
    const {source} = await response.json();
    spotifyStatus.textContent = {
      saved: 'Credentials saved on this computer.',
      environment: 'Using credentials from the launch environment.',
      unconfigured: 'Spotify search has no credentials yet.'
    }[source];
  } catch {
    spotifyStatus.textContent = 'Could not read Spotify settings.';
  }
});
document.querySelector('#close-spotify').addEventListener('click', () => spotifyPanel.close());
spotifyPanel.addEventListener('close', () => {
  spotifyForm.reset();
  historySettings.querySelector('summary').focus();
});
spotifyForm.addEventListener('submit', async event => {
  event.preventDefault();
  const save = spotifyForm.querySelector('button[type="submit"]');
  save.disabled = true;
  try {
    const response = await fetch('/api/settings/spotify', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(Object.fromEntries(new FormData(spotifyForm)))
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error);
    spotifyForm.reset();
    spotifyStatus.textContent = 'Saved. The next Spotify search will use these credentials.';
  } catch (error) {
    spotifyStatus.textContent = error.message || 'Could not save Spotify settings.';
  } finally {
    save.disabled = false;
  }
});
document.querySelector('#refresh-history').addEventListener('click', () => void loadHistory());
olderHistory.addEventListener('click', () => void loadHistory(true));
clearHistory.addEventListener('click', async () => {
  if (loadingHistory || !window.confirm(
    'Permanently delete all saved Declan conversations, including Browser and Assist history?'
  )) return;

  loadingHistory = true;
  clearHistory.disabled = true;
  historyStatus.textContent = 'Clearing history.';
  try {
    const response = await fetch('/api/history/clear', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({confirm: true}),
    });
    if (!response.ok) throw new Error('Clear failed');
    chat.replaceChildren();
    historyCursor = null;
    olderHistory.hidden = true;
    historyStatus.textContent = 'Conversation history cleared.';
  } catch {
    historyStatus.textContent = 'History could not be cleared. Try again.';
  } finally {
    loadingHistory = false;
    clearHistory.disabled = false;
  }
});
const latestMessage = document.querySelector('#latest-message');
const latestReply = document.querySelector('#latest-reply');
const talk = document.querySelector('#talk');
const keyboard = document.querySelector('#keyboard');
const talkLabel = document.querySelector('#talk-label');
const pattern = document.querySelector('#voice-pattern');
const patternContext = pattern.getContext('2d');
const voiceStatus = document.querySelector('#voice-status');
const spokenReplies = document.querySelector('#spoken-replies');
const assistSTT = document.querySelector('#use-assist-stt');
const assistSupported = Boolean(window.AudioContext && navigator.mediaDevices?.getUserMedia);
assistSTT.checked = assistSupported && assistSTT.checked;
assistSTT.disabled = !assistSupported;
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = Recognition ? new Recognition() : null;
let sessionId = null;
let listening = false;
let busy = false;
let handsFree = assistSTT.checked || Boolean(recognition);
let speaking = false;
let restartTimer;
let voiceSubmitTimer;
let voiceTranscript = '';
let meter = null;
let assistRecording = null;
let voiceGeneration = 0;

function drawPattern(samples) {
  if (!patternContext) return;
  const {width, height} = pattern;
  patternContext.clearRect(0, 0, width, height);
  patternContext.strokeStyle = '#91e3ff';
  patternContext.lineWidth = 4;
  patternContext.lineCap = 'round';
  patternContext.beginPath();
  const bars = 19;
  for (let i = 0; i < bars; i++) {
    let peak = 0;
    if (samples) {
      const start = Math.floor(i * samples.length / bars);
      const end = Math.floor((i + 1) * samples.length / bars);
      for (let j = start; j < end; j++) {
        peak = Math.max(peak, Math.abs(samples[j] - 128) / 128);
      }
    }
    const envelope = Math.sin(Math.PI * (i + 1) / (bars + 1));
    const halfBar = (2 + Math.min(1, peak * 3) * height * .43) * envelope;
    const x = (i + 1) * width / (bars + 1);
    patternContext.moveTo(x, height / 2 - halfBar);
    patternContext.lineTo(x, height / 2 + halfBar);
  }
  patternContext.stroke();
}

function stopMeter() {
  if (meter) {
    const current = meter;
    meter = null;
    cancelAnimationFrame(current.frame);
    current.stream?.getTracks().forEach(track => track.stop());
    void current.audio.close().catch(() => {});
  }
  drawPattern();
}

async function startMeter() {
  if (!window.AudioContext || !navigator.mediaDevices?.getUserMedia ||
      window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const current = {audio: new AudioContext(), stream: null, frame: 0};
  meter = current;
  try {
    const resume = current.audio.resume();
    void resume.catch(() => {});
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    if (meter !== current) {
      stream.getTracks().forEach(track => track.stop());
      return;
    }
    current.stream = stream;
    await resume;
    if (meter !== current) return;
    const analyser = current.audio.createAnalyser();
    analyser.fftSize = 1024;
    current.audio.createMediaStreamSource(stream).connect(analyser);
    const samples = new Uint8Array(analyser.fftSize);
    const render = () => {
      analyser.getByteTimeDomainData(samples);
      drawPattern(samples);
      current.frame = requestAnimationFrame(render);
    };
    render();
  } catch {
    if (meter === current) stopMeter();
  }
}

function updateControls() {
  talk.disabled = !assistSTT.checked && !recognition;
  talkLabel.textContent = handsFree ? 'Pause listening' : 'Resume listening';
  talk.setAttribute('aria-pressed', String(listening));
  button.disabled = busy || listening || Boolean(assistRecording);
}
function scheduleListening() {
  clearTimeout(restartTimer);
  if (handsFree && !listening && !busy && !speaking) {
    restartTimer = setTimeout(startListening, 350);
  }
}
function startListening() {
  if (!handsFree || listening || busy || speaking) return;
  if (assistSTT.checked) {
    void startAssistListening();
    return;
  }
  try {
    recognition.start();
    listening = true;
    voiceStatus.textContent = 'Listening.';
    void startMeter().catch(() => {});
  } catch {
    handsFree = false;
    voiceStatus.textContent = 'Tap the orb to enable the microphone, or use the keyboard.';
  }
  updateControls();
}
function pauseListening() {
  handsFree = false;
  voiceGeneration++;
  clearTimeout(restartTimer);
  clearTimeout(voiceSubmitTimer);
  voiceTranscript = '';
  if (assistRecording) stopAssistListening(assistRecording);
  else if (listening) recognition?.abort();
  stopMeter();
  voiceStatus.textContent = 'Microphone paused.';
  updateControls();
}
function add(speaker, text) {
  if (speaker === 'You') {
    latestMessage.textContent = text;
    latestReply.textContent = '';
  } else {
    latestReply.textContent = speaker + ' · ' + text;
  }
}
async function sendMessage(message, fromVoice = false) {
  message = message.trim();
  if (!message || busy) return;
  if (message.length > 1000) {
    add('Chat', 'Please keep the message under 1,000 characters.');
    return;
  }
  add('You', message);
  if (!fromVoice) input.value = '';
  busy = true;
  voiceStatus.textContent = 'Thinking…';
  updateControls();
  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message, session_id: sessionId, source: fromVoice ? 'voice' : 'keyboard'})
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error);
    sessionId = result.session_id;
    add('Declan', result.reply);
    if (historyPanel.open) void loadHistory();
    if (result.history_saved === false) historyStatus.textContent = 'This message could not be saved.';
    if (fromVoice && spokenReplies.checked) {
      const finished = () => {
        speaking = false;
        scheduleListening();
      };
      speaking = true;
      let audioUrl;
      try {
        const voice = await fetch('/api/tts', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message: result.reply})
        });
        if (!voice.ok) throw new Error('Voice unavailable');
        audioUrl = URL.createObjectURL(await voice.blob());
        const audio = new Audio(audioUrl);
        audio.onended = audio.onerror = () => {
          URL.revokeObjectURL(audioUrl);
          finished();
        };
        await audio.play();
      } catch {
        if (audioUrl) URL.revokeObjectURL(audioUrl);
        if ('speechSynthesis' in window) {
          const utterance = new SpeechSynthesisUtterance(result.reply);
          utterance.lang = 'en-GB';
          utterance.onend = utterance.onerror = finished;
          window.speechSynthesis.speak(utterance);
        } else {
          finished();
        }
      }
    }
  } catch (error) {
    speaking = false;
    add('Chat', 'Could not get a reply. ' + error.message);
  } finally {
    busy = false;
    if (voiceStatus.textContent === 'Thinking…') voiceStatus.textContent = '';
    updateControls();
    scheduleListening();
    if (!fromVoice) input.focus();
  }
}
form.addEventListener('submit', event => {
  event.preventDefault();
  if (!listening && !assistRecording) void sendMessage(input.value);
});

function stopAssistListening(recording) {
  if (assistRecording !== recording) return;
  assistRecording = null;
  listening = false;
  recording.stream?.getTracks().forEach(track => track.stop());
  void recording.audio.close().catch(() => {});
}

async function finishAssistRecording(recording) {
  if (assistRecording !== recording) return;
  const generation = voiceGeneration;
  stopAssistListening(recording);
  busy = true;
  voiceStatus.textContent = 'Transcribing with Assist.';
  updateControls();
  try {
    const response = await fetch('/api/stt', {
      method: 'POST',
      headers: {'Content-Type': 'application/octet-stream'},
      body: recording.pcm.buffer.slice(0, recording.length * 2)
    });
    const result = await response.json();
    if (generation !== voiceGeneration) return;
    if (!response.ok) throw new Error(result.error);
    if (!result.text?.trim()) return;
    if (incompleteVoiceCommand.test(result.text)) {
      add('You', result.text);
      add('Declan', 'I only caught part of that. Please say the full command again.');
      return;
    }
    busy = false;
    await sendMessage(result.text, true);
  } catch (error) {
    if (generation === voiceGeneration) {
      handsFree = false;
      voiceStatus.textContent = (error.message || 'Assist speech recognition failed.') +
        ' Retry with the orb or select browser recognition in Settings.';
    }
  } finally {
    busy = false;
    if (voiceStatus.textContent === 'Transcribing with Assist.') voiceStatus.textContent = '';
    updateControls();
    scheduleListening();
  }
}

async function startAssistListening() {
  let recording;
  try {
    const audio = new AudioContext({sampleRate: 16000});
    recording = {audio, pcm: new Int16Array(320000), length: 0, voiced: 0, silence: 0,
                 previous: null, stream: null};
    assistRecording = recording;
    listening = true;
    updateControls();
    if (audio.sampleRate !== 16000) throw new Error('This browser cannot record at 16 kHz.');
    const resume = audio.resume();
    void resume.catch(() => {});
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    if (assistRecording !== recording) {
      stream.getTracks().forEach(track => track.stop());
      return;
    }
    recording.stream = stream;
    await resume;
    if (assistRecording !== recording) return;
    const source = audio.createMediaStreamSource(stream);
    const capture = audio.createScriptProcessor(2048, 1, 1);
    capture.onaudioprocess = event => {
      if (assistRecording !== recording) return;
      const samples = event.inputBuffer.getChannelData(0);
      const energy = samples.reduce((sum, sample) => sum + sample * sample, 0);
      const audible = energy > samples.length * 0.015 ** 2;
      if (!recording.voiced && !audible) {
        recording.previous = samples.slice();
        return;
      }
      if (!recording.voiced && recording.previous) {
        for (const sample of recording.previous) {
          recording.pcm[recording.length++] = Math.max(-32768, Math.min(32767, sample * 32768));
        }
      }
      if (audible) recording.voiced += samples.length;
      recording.silence = audible ? 0 : recording.silence + samples.length;
      for (const sample of samples) {
        if (recording.length === recording.pcm.length) break;
        recording.pcm[recording.length++] = Math.max(-32768, Math.min(32767, sample * 32768));
      }
      if (recording.silence >= 24000 || recording.length === recording.pcm.length) {
        if (recording.voiced >= 2400) void finishAssistRecording(recording);
        else recording.length = recording.voiced = recording.silence = 0;
      }
    };
    source.connect(capture);
    capture.connect(audio.destination);
    voiceStatus.textContent = 'Listening with Assist.';
  } catch (error) {
    if (recording && assistRecording !== recording) return;
    if (recording) stopAssistListening(recording);
    handsFree = false;
    voiceStatus.textContent = error.message || 'Could not open the microphone.';
    updateControls();
  }
}

const incompleteVoiceCommand = /\b(?:and|as well as|then|in the)[\s,.!?]*$/i;
if (recognition) {
  recognition.lang = 'en-GB';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onresult = event => {
    if (!handsFree || busy || speaking) return;
    clearTimeout(voiceSubmitTimer);
    let hasInterim = false;
    for (let index = event.resultIndex; index < event.results.length; index++) {
      const result = event.results[index];
      if (result.isFinal) {
        voiceTranscript = (voiceTranscript + ' ' + result[0].transcript.trim()).trim();
      } else {
        hasInterim = true;
      }
    }
    if (hasInterim || !voiceTranscript) return;
    const unfinished = incompleteVoiceCommand.test(voiceTranscript);
    voiceStatus.textContent = unfinished ? 'Keep going. I’m listening.' : 'Listening.';
    voiceSubmitTimer = setTimeout(() => {
      const message = voiceTranscript;
      voiceTranscript = '';
      if (!handsFree || busy || speaking) return;
      if (unfinished) {
        add('You', message);
        add('Declan', 'I only caught part of that. Please say the full command again.');
        voiceStatus.textContent = 'Listening.';
        return;
      }
      if (listening) recognition.abort();
      void sendMessage(message, true);
    }, unfinished ? 5000 : 1400);
  };
  recognition.onerror = event => {
    if (event.error === 'no-speech' || event.error === 'aborted') return;
    handsFree = false;
    clearTimeout(voiceSubmitTimer);
    voiceTranscript = '';
    if (event.error === 'not-allowed' || event.error === 'audio-capture') keyboard.open = true;
    voiceStatus.textContent = event.error === 'not-allowed'
      ? 'Allow microphone access in your browser, or type below.'
      : 'Voice input could not complete. Try again or type below.';
  };
  recognition.onend = () => {
    if (assistRecording) return;
    listening = false;
    stopMeter();
    if (voiceStatus.textContent === 'Listening.') voiceStatus.textContent = '';
    updateControls();
    scheduleListening();
  };
}
talk.addEventListener('click', () => {
  if (handsFree) {
    pauseListening();
  } else {
    handsFree = true;
    startListening();
    updateControls();
  }
});
keyboard.addEventListener('toggle', () => {
  if (keyboard.open && handsFree) pauseListening();
});
assistSTT.addEventListener('change', () => {
  pauseListening();
  handsFree = assistSTT.checked || Boolean(recognition);
  startListening();
  updateControls();
});
if (handsFree) startListening();
else {
  keyboard.open = true;
  voiceStatus.textContent = 'Voice input is unavailable in this browser. You can type below.';
}
updateControls();
drawPattern();
</script>
