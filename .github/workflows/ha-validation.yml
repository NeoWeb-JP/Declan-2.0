name: Home Assistant Hassfest validation

on:
  push:
    branches: [main]
    paths:
      - "custom_components/**"
      - "hacs.json"
      - ".github/workflows/ha-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "custom_components/**"
      - "hacs.json"
      - ".github/workflows/ha-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master

