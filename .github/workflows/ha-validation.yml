name: Home Assistant Hassfest validation

# Hassfest validates only the integration package (manifest, services,
# translations, structure). custom_components/declan_two does not import the
# backend (declan/, server.py), so backend-only changes cannot affect it and
# are covered by the regression and quality workflows instead.

on:
  push:
    branches: [main]
    paths:
      - "custom_components/**"
      - "hacs.json"
      - ".github/workflows/ha-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "custom_components/**"
      - "hacs.json"
      - ".github/workflows/ha-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@9e9565e68f5a70d874202871f4c4064d23814235 # master snapshot 2026-11-17

