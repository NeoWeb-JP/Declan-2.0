name: Declan CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Linux Python regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Check refactor source-location assertions
        if: github.event_name == 'pull_request'
        run: python scripts/check_refactor_test_anchors.py --base-ref origin/main
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Install coverage tool
        run: python -m pip install coverage==7.13.5 Jinja2==3.1.6 tzdata==2025.3 cryptography==50.0.0
      - name: Run regression tests
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Require 80% Python line coverage
        run: python -m coverage report

  browser:
    name: Browser JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Check native Home Assistant panel JavaScript syntax
        run: node --check custom_components/declan_two/frontend/panel.js
      - run: npm ci
      - run: npm test
