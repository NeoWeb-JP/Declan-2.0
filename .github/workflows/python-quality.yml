name: Python quality and dependency audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Advisory Python quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install audit tools
        run: python -m pip install ruff==0.14.5 bandit==1.9.1 pip-audit==2.9.0 mypy==1.18.2
      - name: Ruff lint
        run: ruff check . --output-format github
      - name: Mypy repository type check (blocking)
        run: |
          # Runtime integration dependencies are absent in this audit job.
          # Enforce all available type diagnostics across every source file.
          python -m mypy --config-file mypy.ini \
            --disable-error-code import-not-found .
      - name: Mypy dependency import inventory (advisory)
        continue-on-error: true
        run: |
          # The blocking check above already rejects all available source-level
          # diagnostics. This separate check inventories imports unavailable in
          # the minimal audit environment (not production type regressions).
          # Preserve the advisory exit status while recording actionable counts.
          set +e
          python -m mypy --config-file mypy.ini --show-error-codes . > mypy-advisory.log 2>&1
          result=$?
          cat mypy-advisory.log
          missing=$(grep -c '\[import-not-found\]' mypy-advisory.log || true)
          other=$(grep 'error: ' mypy-advisory.log | grep -vc '\[import-not-found\]' || true)
          {
            echo "### Advisory mypy inventory"
            echo "- Missing runtime imports: ${missing}"
            echo "- Other type diagnostics: ${other}"
            echo "- Exit status: ${result} (advisory; blocking check runs above)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Bandit security scan
        run: bandit -r . -x ./tests,./.git -q
      - name: Audit tracked requirements files
        shell: bash
        run: |
          # Git's **/ glob can omit root files; match both root and nested paths.
          mapfile -d '' -t files < <(git ls-files -z -- 'requirements*.txt' ':(glob)**/requirements*.txt' | sort -zu)
          if (("${#files[@]}" == 0)); then
            echo "No tracked requirements files found." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Auditing ${#files[@]} tracked requirements file(s)." | tee -a "$GITHUB_STEP_SUMMARY"
          failures=0
          for file in "${files[@]}"; do
            echo "Auditing $file"
            if python -m pip_audit -r "$file" --disable-pip --no-deps; then
              echo "- PASS: \`$file\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- REVIEW: \`$file\` (vulnerability or audit error)" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
            fi
          done
          if ((failures > 0)); then
            echo "$failures requirement file(s) need review."
            exit 1
          fi
