name: Python quality and dependency audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Advisory Python quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install audit tools
        run: python -m pip install ruff==0.14.5 bandit==1.9.1 pip-audit==2.9.0 mypy==1.18.2
      - name: Ruff lint
        run: ruff check . --output-format github
      - name: Mypy repository type check (blocking)
        run: |
          # The audit runner has no Home Assistant runtime dependencies. Check
          # all discovered source files except ConfigFlow, whose HA base type
          # is unavailable here; keep it in the full advisory scan below.
          python -m mypy --config-file mypy.ini \
            --disable-error-code import-not-found \
            --exclude '^custom_components/declan_two/config_flow\.py$' .
      - name: Mypy full-repository baseline (advisory)
        continue-on-error: true
        run: python -m mypy --config-file mypy.ini .
      - name: Bandit security scan
        run: bandit -r . -x ./tests,./.git -q
      - name: Audit tracked requirements files
        shell: bash
        run: |
          # Git's **/ glob can omit root files; match both root and nested paths.
          mapfile -d '' -t files < <(git ls-files -z -- 'requirements*.txt' ':(glob)**/requirements*.txt' | sort -zu)
          if (("${#files[@]}" == 0)); then
            echo "No tracked requirements files found." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Auditing ${#files[@]} tracked requirements file(s)." | tee -a "$GITHUB_STEP_SUMMARY"
          failures=0
          for file in "${files[@]}"; do
            echo "Auditing $file"
            if python -m pip_audit -r "$file" --disable-pip --no-deps; then
              echo "- PASS: \`$file\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- REVIEW: \`$file\` (vulnerability or audit error)" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
            fi
          done
          if ((failures > 0)); then
            echo "$failures requirement file(s) need review."
            exit 1
          fi
