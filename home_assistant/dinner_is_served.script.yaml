alias: Declan - Dinner Is Served
description: Announce dinner using Declan's supplied line, then set lighting and play the dinner playlist.
icon: mdi:silverware-fork-knife
mode: restart
fields:
  dinner_message:
    name: Dinner announcement
    description: The line selected by Declan.
    selector:
      text: {}
sequence:
  - alias: Set Kitchen Echo volume
    action: alexa_devices.send_text_command
    data:
      device_id: 983f3c59cefea7663ce9de13def1d994
      text_command: Set volume to 3
    continue_on_error: true
  - alias: Announce dinner
    action: alexa_devices.send_text_command
    data:
      device_id: fa7b31d00c6a6279a81cf73010217dba
      text_command: "{{ 'Simon says ' ~ (dinner_message | default('Dinner is served.', true)) }}"
    continue_on_error: true
  - alias: Allow announcement to finish
    delay:
      seconds: 18
  - alias: Turn on dinner lights
    action: switch.turn_on
    target:
      entity_id:
        - switch.giraffedy
        - switch.tv_lights
  - alias: Set dining room to 30 percent
    action: light.turn_on
    target:
      entity_id: light.dining_room
    data:
      brightness_pct: 30
      transition: 3
  - alias: Turn off kitchen spotlights
    action: light.turn_off
    target:
      entity_id: light.kitchen_kitchen_switch_light_1
    data:
      transition: 3
  - alias: Find active music players
    variables:
      active_music_players: >-
        {{ states.media_player | selectattr('state', 'in', ['playing', 'paused', 'buffering'])
           | selectattr('entity_id', 'in', integration_entities('music_assistant'))
           | map(attribute='entity_id') | list }}
  - alias: Stop active Music Assistant playback
    if:
      - condition: template
        value_template: "{{ active_music_players | count > 0 }}"
    then:
      - action: media_player.media_stop
        continue_on_error: true
        target:
          entity_id: "{{ active_music_players }}"
  - alias: Play dinner playlist through Music Assistant
    action: music_assistant.play_media
    target:
      entity_id: media_player.kitchen_declan_voice_assistant
    data:
      media_type: playlist
      media_id: https://open.spotify.com/playlist/37i9dQZF1DXbm6HfkbMtFZ
      enqueue: replace
