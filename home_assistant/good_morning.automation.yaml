alias: "Declan - Good Morning"
triggers:
  - trigger: conversation
    command:
      - "good morning"
      - "morning"
      - "start the morning routine"
conditions: []
actions:
  - action: script.declan_good_morning_shared_local_routine
    data: {}
    response_variable: morning_result
    continue_on_error: true
  - variables:
      spoken_reply: >-
        {% set result = morning_result | default({}) %}
        {% set greeting = (result.get('response') or result.get('speech'))
           if result is mapping else none %}
        {{ greeting if greeting is string and greeting | trim
           else "Good morning. I couldn't confirm the routine completed." }}
      routine_confirmed: "{{ morning_result is mapping and morning_result.get('status') == 'success' }}"
  - set_conversation_response: "{{ spoken_reply }}"
  - event: declan_two_assist_reply
    event_data:
      message: "{{ trigger.sentence }}"
      reply: "{{ spoken_reply }}"
      session_id: "{{ trigger.user_input.conversation_id }}"
      outcome: "{{ 'reported_success' if routine_confirmed else 'unverified' }}"
      routine_status: >-
        {{ 'Home Assistant reports the routine completed.' if routine_confirmed
           else 'Home Assistant did not confirm the routine completed.' }}
mode: single
