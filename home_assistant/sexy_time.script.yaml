alias: Declan - Sexy Time Controller
description: >-
  Set or restore the mood in the room where Sexy Time was asked for, and ask
  Declan to play or stop Sexy Time music there. The master bedroom keeps its
  own lights, plus the bedroom spotlight Mood zone (pink on start, put back on
  end). Any other room gets a generic dim, warm/pink mood that is restored
  afterwards (FUT-60). The faulty bedroom main light and the slow,
  cloud-bridged spotlights are optional and excluded from verification.
mode: queued
max: 5
fields:
  operation:
    name: Operation
    default: start
    selector:
      select:
        options: [start, end]
  origin:
    name: Where the request came from
    description: >-
      Satellite device or entity that heard the request, sent by Declan. Its
      Home Assistant area decides the room. Empty means the master bedroom.
    selector:
      text:
sequence:
  - variables:
      op: "{{ operation | default('start') }}"
      origin_area: >-
        {% set source = origin | default('', true) %}
        {{ (area_name(source) if source else '') or '' }}
      room: "{{ origin_area if origin_area else 'Master Bedroom' }}"
      tailored: "{{ room | lower in ['master bedroom', 'bedroom'] }}"
      room_lights: >-
        {{ area_entities(room) | select('match', 'light\\.') | list }}
      colour_lights: >-
        {% set result = namespace(lights=[]) %}
        {% for entity in area_entities(room) | select('match', 'light\\.') %}
          {% set modes = state_attr(entity, 'supported_color_modes') or [] %}
          {% if modes | select('in', ['hs', 'rgb', 'rgbw', 'rgbww', 'xy']) | list | count > 0 %}
            {% set result.lights = result.lights + [entity] %}
          {% endif %}
        {% endfor %}
        {{ result.lights }}
      mood_scene: "declan_mood_{{ room | slugify }}"
      mood_available: >-
        {{ states('light.bedroom_mood_lights') not in ['unknown', 'unavailable'] }}
      player: >-
        {% if tailored %}
          media_player.master_bedroom_declan
        {% else %}
          {% set result = namespace(players=[]) %}
          {% for entity in integration_entities('music_assistant') %}
            {% if entity.startswith('media_player.')
               and area_name(entity) | default('', true) | lower == room | lower
               and states(entity) not in ['unknown', 'unavailable'] %}
              {% set result.players = result.players + [entity] %}
            {% endif %}
          {% endfor %}
          {{ result.players[0] if result.players | count == 1 else '' }}
        {% endif %}
  - if: "{{ op not in ['start', 'end'] }}"
    then:
      - stop: Unknown Sexy Time operation.
        error: true
  # ---------------- Music first, in the same room ----------------
  # Lights can be slow (cloud-bridged spotlights), so music never waits for them.
  - choose:
      - conditions: "{{ op == 'start' }}"
        sequence:
          - if: "{{ player != '' }}"
            then:
              - action: media_player.volume_set
                target:
                  entity_id: "{{ player }}"
                data:
                  volume_level: 0.2
                continue_on_error: true
          - alias: Ask Declan for Sexy Time music in this room
            action: conversation.process
            data:
              agent_id: conversation.declan_2_0
              text: "Play sexy time music in the {{ room | lower }}"
            response_variable: music_reply
            continue_on_error: true
    default:
      - alias: Ask Declan to stop the music in this room
        action: conversation.process
        data:
          agent_id: conversation.declan_2_0
          text: "Stop music in the {{ room | lower }}"
        response_variable: music_stop_reply
        continue_on_error: true
  - choose:
      # ---------------- Master bedroom: its own hand-picked lights ----------------
      - conditions: "{{ tailored }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id:
                - light.master_bedroom_fairy_lights
                - light.master_bedroom_queen_lamp
          - action: "light.turn_{{ 'off' if op == 'start' else 'on' }}"
            target:
              entity_id: light.master_bedroom_bedroom_lamp
          - choose:
              - conditions: "{{ op == 'start' }}"
                sequence:
                  - alias: Remember the bedroom spotlight Mood zone, then make it pink
                    if: "{{ mood_available }}"
                    then:
                      - action: scene.create
                        data:
                          scene_id: declan_mood_bedroom_spotlights
                          snapshot_entities: [light.bedroom_mood_lights]
                        continue_on_error: true
                      - action: light.turn_on
                        target:
                          entity_id: light.bedroom_mood_lights
                        data:
                          brightness_pct: 30
                          rgb_color: [255, 0, 255]
                        continue_on_error: true
            default:
              - alias: "Optional main light: faulty, excluded from success checks"
                action: light.turn_on
                target:
                  entity_id: light.master_bedroom_main_light
                data:
                  brightness_pct: 50
                  color_temp_kelvin: 3000
                continue_on_error: true
              - alias: Put the bedroom spotlight Mood zone back (off if nothing was remembered)
                if: "{{ mood_available }}"
                then:
                  - if: "{{ states('scene.declan_mood_bedroom_spotlights') not in ['unknown', 'unavailable'] }}"
                    then:
                      - action: scene.turn_on
                        target:
                          entity_id: scene.declan_mood_bedroom_spotlights
                        continue_on_error: true
                    else:
                      - action: light.turn_off
                        target:
                          entity_id: light.bedroom_mood_lights
                        continue_on_error: true
      # ---------------- Any other room: remember, dim, put back ----------------
      - conditions: "{{ room_lights | count > 0 and op == 'start' }}"
        sequence:
          - action: scene.create
            data:
              scene_id: "{{ mood_scene }}"
              snapshot_entities: "{{ room_lights }}"
          - action: light.turn_on
            target:
              entity_id: "{{ room_lights }}"
            data:
              brightness_pct: 30
          - if: "{{ colour_lights | count > 0 }}"
            then:
              - action: light.turn_on
                target:
                  entity_id: "{{ colour_lights }}"
                data:
                  brightness_pct: 30
                  rgb_color: [255, 0, 255]
      - conditions: "{{ room_lights | count > 0 and op == 'end' }}"
        sequence:
          - if: "{{ states('scene.' ~ mood_scene) not in ['unknown', 'unavailable'] }}"
            then:
              - action: scene.turn_on
                target:
                  entity_id: "scene.{{ mood_scene }}"
            else:
              - action: light.turn_on
                target:
                  entity_id: "{{ room_lights }}"
                data:
                  brightness_pct: 50
  - if: "{{ not tailored }}"
    then:
      - wait_template: >-
          {{ room_lights | count > 0 and (op == 'end' or room_lights | select('is_state', 'on') | list | count == room_lights | count) }}
        timeout: "00:00:03"
        continue_on_timeout: true
  - variables:
      result:
        operation: "{{ op }}"
        room: "{{ room }}"
        lighting_ok: >-
          {% if tailored %}
            {{ is_state('light.master_bedroom_fairy_lights', 'on')
               and is_state('light.master_bedroom_queen_lamp', 'on')
               and is_state('light.master_bedroom_bedroom_lamp', 'off' if op == 'start' else 'on') }}
          {% else %}
            {{ room_lights | count > 0 and (op == 'end' or room_lights | select('is_state', 'on') | list | count == room_lights | count) }}
          {% endif %}
        music_stopped: "{{ op == 'end' and player != '' and states(player) in ['idle', 'off', 'standby'] }}"
        music_request_submitted: "{{ op == 'start' and music_reply is defined }}"
        music_stop_request_submitted: "{{ op == 'end' and music_stop_reply is defined }}"
  - action: "input_boolean.turn_{{ 'on' if op == 'start' else 'off' }}"
    target:
      entity_id: input_boolean.declan_sexy_time_active
  - stop: Mood routine complete.
    response_variable: result
