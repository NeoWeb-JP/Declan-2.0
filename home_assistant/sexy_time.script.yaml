alias: Declan - Sexy Time Controller
description: Set or restore the bedroom lights, set the starting volume, and stop bedroom music on end.
mode: queued
max: 5
fields:
  music_player:
    name: Music player resolved by Declan
    description: Optional Music Assistant player. Declan manages its volume and playback when supplied.
    selector:
      entity:
        domain: media_player
  operation:
    name: Operation
    default: start
    selector:
      select:
        options: [start, end]
sequence:
  - variables:
      op: "{{ operation | default('start') }}"
      bedroom_players: >-
        {% set result = namespace(players=[]) %}
        {% for entity in integration_entities('music_assistant') %}
          {% if entity.startswith('media_player.')
             and area_name(entity) | default('', true) | lower in ['bedroom', 'master bedroom']
             and states(entity) not in ['unknown', 'unavailable'] %}
            {% set result.players = result.players + [entity] %}
          {% endif %}
        {% endfor %}
        {{ result.players }}
  - variables:
      player: >-
        {% set requested = music_player | default('', true) %}
        {{ requested if requested in bedroom_players
           else bedroom_players[0] if bedroom_players | count == 1 else '' }}
      managed_music: "{{ music_player | default('', true) != '' }}"
  - if: "{{ op not in ['start', 'end'] }}"
    then:
      - stop: Unknown Sexy Time operation.
        error: true
  - action: light.turn_on
    target:
      entity_id:
        - light.master_bedroom_fairy_lights
        - light.master_bedroom_queen_lamp
  - action: "light.turn_{{ 'off' if op == 'start' else 'on' }}"
    target:
      entity_id: light.master_bedroom_bedroom_lamp
  - choose:
      - conditions: "{{ op == 'start' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.master_bedroom_main_light
            data:
              brightness_pct: 50
              rgb_color: [255, 0, 255]
          - if: "{{ not managed_music and player != '' }}"
            then:
              - action: media_player.volume_set
                target:
                  entity_id: "{{ player }}"
                data:
                  volume_level: 0.2
                continue_on_error: true
    default:
      - action: light.turn_on
        target:
          entity_id: light.master_bedroom_main_light
        data:
          brightness_pct: 50
          color_temp_kelvin: 3000
      - if: "{{ not managed_music and player != '' }}"
        then:
          - action: media_player.media_stop
            target:
              entity_id: "{{ player }}"
            continue_on_error: true
  - wait_template: >-
      {{ is_state('light.master_bedroom_fairy_lights', 'on')
         and is_state('light.master_bedroom_queen_lamp', 'on')
         and is_state('light.master_bedroom_main_light', 'on')
         and is_state('light.master_bedroom_bedroom_lamp', 'off' if op == 'start' else 'on')
         and (op == 'start' or managed_music or states(player) in ['idle', 'off', 'standby']) }}
    timeout: "00:00:03"
    continue_on_timeout: true
  - variables:
      result:
        operation: "{{ op }}"
        lighting_ok: >-
          {{ is_state('light.master_bedroom_fairy_lights', 'on')
             and is_state('light.master_bedroom_queen_lamp', 'on')
             and is_state('light.master_bedroom_main_light', 'on')
             and is_state('light.master_bedroom_bedroom_lamp', 'off' if op == 'start' else 'on') }}
        music_stopped: "{{ op == 'end' and states(player) in ['idle', 'off', 'standby'] }}"
  - if: "{{ result.lighting_ok }}"
    then:
      - action: "input_boolean.turn_{{ 'on' if op == 'start' else 'off' }}"
        target:
          entity_id: input_boolean.declan_sexy_time_active
  - stop: Bedroom routine complete.
    response_variable: result
