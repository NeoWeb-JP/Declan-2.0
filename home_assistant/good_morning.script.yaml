alias: Declan - Good Morning - Shared Local Routine
mode: single
fields:
  request_id:
    selector:
      text: {}
  routine_id:
    selector:
      text: {}
sequence:
  - alias: Turn on lounge wall lights
    action: light.turn_on
    target:
      entity_id: light.living_room_wall_lights
    continue_on_error: true
  - alias: Turn on dining room lights at 10 percent
    action: light.turn_on
    target:
      entity_id: light.dining_room
    data:
      brightness_pct: 10
    continue_on_error: true
  - alias: Wait for both lights to report the requested states
    wait_template: >-
      {% set brightness = state_attr('light.dining_room', 'brightness') %}
      {{ is_state('light.living_room_wall_lights', 'on')
         and is_state('light.dining_room', 'on')
         and brightness is number and 23 <= brightness <= 28 }}
    timeout: "00:00:03"
    continue_on_timeout: true
  - alias: Record observed states
    variables:
      wall_lights_confirmed: "{{ is_state('light.living_room_wall_lights', 'on') }}"
      dining_lights_confirmed: >-
        {% set brightness = state_attr('light.dining_room', 'brightness') %}
        {{ is_state('light.dining_room', 'on')
           and brightness is number and 23 <= brightness <= 28 }}
  - variables:
      declan_local_result:
        schema_version: 1
        request_id: "{{ request_id | default('') }}"
        routine_id: "{{ routine_id | default('') }}"
        outcome: >-
          {{ 'success' if wall_lights_confirmed and dining_lights_confirmed
             else 'partial' if wall_lights_confirmed or dining_lights_confirmed else 'unknown' }}
        guest_mode: "{{ states('input_boolean.guest_mode') }}"
        steps:
          - target: lounge wall lights
            entity_id: light.living_room_wall_lights
            action: turn_on
            required: true
            status: "{{ 'confirmed' if wall_lights_confirmed else 'unverified' }}"
          - target: dining lights at ten percent
            entity_id: light.dining_room
            action: set_brightness
            required: true
            status: "{{ 'confirmed' if dining_lights_confirmed else 'unverified' }}"
  - stop: Routine finished
    response_variable: declan_local_result
